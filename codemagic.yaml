workflows:
  build-react-apk:
    name: Build React Web App as Android APK
    max_build_duration: 30
    environment:
      flutter: "false"
      node: 18.16.0
      java: 11
    scripts:
      - npm install
      - npm run build
      - npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
      - npx cap init WeatherMate com.valentia.weatherapp --web-dir=build
      - npx cap add android
      - cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk